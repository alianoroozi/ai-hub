[project]
name = "ai-hub"
version = "0.1.0"
description = "AI Hub"
authors = [
    {name = "Ali Noroozi",email = "aliasghar.noroozi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.2",
    "ipywidgets>=8.1.6",
    "openai>=1.71.0",
    "openai-agents>=0.0.17",
    "pika>=1.3.2",
    "pillow>=11.2.1",
    "pymongo>=4.13.2",
    "structlog>=25.4.0",
    "transformers>=4.51.3",
    "youtube-transcript-api>=1.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.12.1",
]

[tool.ruff]
target-version = "py311"
