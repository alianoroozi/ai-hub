[project]
name = "ai-hub"
version = "0.1.0"
description = "AI Hub"
authors = [
    {name = "Ali Noroozi",email = "aliasghar.noroozi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.2",
    "ipywidgets>=8.1.6",
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "langchain-ollama>=0.3.8",
    "langchain-openai>=0.3.33",
    "langchain-tavily>=0.2.11",
    "langgraph>=0.6.7",
    "loguru>=0.7.3",
    "openai>=1.71.0",
    "openai-agents>=0.0.17",
    "pillow>=11.2.1",
    "pymongo>=4.13.2",
    "torch>=2.8.0",
    "transformers>=4.51.3",
    "youtube-transcript-api>=1.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pre-commit>=4.2.0",
    "ruff>=0.12.1",
]

[tool.ruff]
target-version = "py311"
